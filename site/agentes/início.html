
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aedes Lab</title>

  <link rel="stylesheet" href="início.css">
</head>

<body>

  <header>
    <div class="brand">
      <div class="logo"></div>

      <div class="brand-info">
        <h3>Aedes Lab</h3>
        <p>Itambé-PE</p>
      </div>
    </div>

  </header>

  <main>
    <section class="hero">

      <h1>Denuncie</h1>

      <p class="hero-description">
        Denuncie pontos de foco do <i>aedes</i> no seu bairro
      </p>

      <button class="main-button" id="denuncia">
        Denuncie aqui
      </button>

    </section>

    <section class="content">

      <div class="guide-card">

        <h2>Guia Aedes</h2>

        <p>
          Descubra informações sobre o mosquito,
          a doença e as formas de prevenção.
        </p>

        <button class="secondary-button">
          Descubra mais aqui
        </button>

      </div>

      <div class="features">

        <article class="feature-card">

          <h3>Mapa de focos</h3>

          <button class="secondary-button">
            Ver mapa
          </button>

        </article>

        <article class="feature-card">

          <h3>Jogo educativo</h3>

          

          <button class="secondary-button">
            Jogar
          </button>

        </article>

      </div>
    </section>
  </main>

</body>
</html>
