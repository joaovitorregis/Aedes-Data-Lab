<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mapa de ocorrências | Aedes Data Lab</title>
    <link rel="icon" href="../assets/imagens/logo.webp" type="image/webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="../css/mapa.css">
  <link rel="stylesheet" href="../css/menu.css">
</head>

<body>

  <header class="cabecalho-site">
    <img src="../assets/imagens/logo.webp" alt="Logo Aedes Data Lab">
    <div>
      <p class="cabecalho-nome">Aedes Lab</p>
      <p class="cabecalho-cidade">Itambé · PE</p>
    </div>
    <button class="menu-botao" type="button" aria-label="Abrir menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

    <main class="container">

        <section class="map-section">

            <h1>Mapa de ocorrências</h1>

            <p class="subtitle">
                Relatos de possíveis criadouros em Itambé/PE
            </p>

            <div class="top-buttons">
                <button id="openFilters" class="filter-button" type="button">
                    Filtros <span id="filterCount" class="filter-count" hidden></span>
                </button>

                <button id="centerMap" class="center-button" type="button">
                    Centralizar em mim
                </button>
            </div>

            <p id="avisoLocal" class="aviso" role="status"></p>

            <div class="map-area">
                <div id="mapa" class="map"></div>
                <div class="map-legend">
                    <span class="legend-dot"></span>
                    <span>Localização aproximada dos relatos</span>
                </div>
            </div>

            <p id="situacao" class="situacao" role="status">Carregando denúncias...</p>
            <button id="tentarDeNovo" class="list-button" type="button" hidden>Tentar de novo</button>

            <p class="map-description">
                Relatos de cidadãos e agentes; não são focos confirmados.
            </p>

        </section>

    </main>

    <!-- FILTROS -->
    <dialog id="filtros" class="filtros">
        <form method="dialog">

            <div class="filtros-topo">
                <h2>Filtros</h2>
                <button class="filtros-fechar" aria-label="Fechar">×</button>
            </div>

            <fieldset>
                <legend>Período de recebimento</legend>
                <div class="chips">
                    <label><input type="radio" name="periodo" value="" checked><span>Todos</span></label>
                    <label><input type="radio" name="periodo" value="hoje"><span>Hoje</span></label>
                    <label><input type="radio" name="periodo" value="7"><span>7 dias</span></label>
                    <label><input type="radio" name="periodo" value="30"><span>30 dias</span></label>
                </div>
            </fieldset>

            <label class="campo">
                Localidade
                <select name="bairro" id="filtroBairro">
                    <option value="">Todas as localidades</option>
                </select>
            </label>

            <fieldset>
                <legend>Etapa</legend>
                <div class="chips" id="filtroEtapas"></div>
            </fieldset>

            <div class="filtros-acoes">
                <button type="reset" class="limpar">Limpar</button>
                <button id="applyFilters" class="aplicar">Concluir</button>
            </div>

        </form>
    </dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="../js/cidadao/mapa.js"></script>

  <script src="../js/compartilhado/menu.js" defer></script>
</body>
</html>
